[build-system]
# The version comes from the git tag (setuptools-scm), not from a file: a release never commits it.
requires = ["setuptools>=80", "setuptools-scm[simple]>=9.2"]
build-backend = "setuptools.build_meta"

[project]
name = "powerview_connect"
dynamic = ["version"]
description = "Async library for Hunter Douglas / Luxaflex PowerView Gen 3 gateways: a hub that keeps a whole home current from the event stream, single-rail moves, and motion tracking - over the local HTTP API."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "HairingX" }]
keywords = [
    "powerview",
    "hunter-douglas",
    "luxaflex",
    "shades",
    "asyncio",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Framework :: AsyncIO",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Libraries",
    "Topic :: Home Automation",
    "Typing :: Typed",
]
requires-python = ">=3.12"
dependencies = [
    "aiohttp>=3.10",
]

[project.urls]
Homepage = "https://github.com/HairingX/powerview_connect"
Source = "https://github.com/HairingX/powerview_connect"
Issues = "https://github.com/HairingX/powerview_connect/issues"
Releases = "https://github.com/HairingX/powerview_connect/releases"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
# PEP 561: tells a type checker the package ships its own types, so a consumer does not have
# to silence the import.
powerview_connect = ["py.typed"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "live: reads a real gateway; skipped unless one is configured. Exclude with -m \"not live\".",
]
log_cli = true
log_cli_level = "DEBUG"
log_cli_format = "%(asctime)s [%(levelname)8s] %(message)s (%(filename)s:%(lineno)s)"
log_cli_date_format = "%Y-%m-%d %H:%M:%S"

[tool.coverage.run]
branch = true
source = ["powerview_connect"]

[tool.coverage.report]
# Every line and branch of the package is covered, and stays so.
fail_under = 100
show_missing = true

[tool.pyright]
# The standard belongs to the repository, not to a personal editor setting: an IDE and a CI
# run must agree on what counts as an error.
include = ["src", "tests"]
exclude = ["**/__pycache__", "**/.venv", "**/.claude"]
typeCheckingMode = "strict"
reportMissingTypeStubs = "none"

[[tool.pyright.executionEnvironments]]
# Tests import the installed package, as its users do (pip install -e .), and each other as
# `conftest`, as pytest resolves them from the tests directory.
root = "tests"
extraPaths = ["tests"]
reportPrivateUsage = "none"
